[project]
name = "waypoint-ai-service"
version = "0.1.0"
description = "WayPoint agentic RAG service"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "langgraph>=1,<2",
    "google-genai>=1,<2",
    "qdrant-client>=1.14,<2",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pypdf>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
