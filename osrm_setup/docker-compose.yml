version: "3.8"

volumes:
  osm-data:

services:
  # Data loader: pulls your pre-processed Sri Lanka map data from Docker Hub
  osrm-data-init:
    image: janithdev/waypoint-osrm:latest
    command: ["sh", "-c", "cp -rn /data/* /shared-data/"]
    volumes:
      - osm-data:/shared-data

  # Van routing backend
  osrm-van:
    image: osrm/osrm-backend:latest
    restart: unless-stopped
    volumes:
      - osm-data:/data:ro
    depends_on:
      osrm-data-init:
        condition: service_completed_successfully
    command: ["osrm-routed", "--algorithm", "mld", "/data/van/van.osrm"]

  # Truck routing backend
  osrm-truck:
    image: osrm/osrm-backend:latest
    restart: unless-stopped
    volumes:
      - osm-data:/data:ro
    depends_on:
      osrm-data-init:
        condition: service_completed_successfully
    command: ["osrm-routed", "--algorithm", "mld", "/data/truck/truck.osrm"]

  # Gateway router (single access point on port 80)
  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - osrm-van
      - osrm-truck
