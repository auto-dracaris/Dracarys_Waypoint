<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sri Lanka 3D Driver Navigation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css"
    />
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      html,
      body,
      #map {
        height: 100%;
        width: 100%;
      }

      #controls {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 10;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(6px);
        padding: 16px 20px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        width: 280px;
      }

      h3 {
        margin: 0 0 12px 0;
        font-size: 16px;
        color: #111;
      }
      .field {
        margin-bottom: 12px;
      }
      label {
        font-size: 13px;
        color: #555;
        display: block;
        margin-bottom: 4px;
        font-weight: 500;
      }

      select,
      button {
        width: 100%;
        padding: 9px 10px;
        border-radius: 6px;
        font-size: 14px;
        box-sizing: border-box;
        border: 1px solid #ccc;
      }

      button {
        margin-top: 4px;
        color: white;
        border: none;
        font-weight: 600;
        cursor: pointer;
        transition: filter 0.15s ease;
      }

      button:hover {
        filter: brightness(0.9);
      }
      button:disabled {
        background: #ccc !important;
        cursor: not-allowed;
      }

      #clearBtn {
        background: #374151;
      }
      #driveBtn {
        background: #10b981;
        margin-top: 10px;
      }

      #info {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid #e5e5e5;
        font-size: 13px;
        line-height: 1.5;
        color: #333;
      }

      #credit {
        margin-top: 10px;
        font-size: 11px;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <h3>3D Route Navigation</h3>
      <div class="field">
        <label for="vehicle">Vehicle Profile</label>
        <select id="vehicle">
          <option value="van">Van</option>
          <option value="truck">15-Ton Truck</option>
        </select>
      </div>
      <button id="clearBtn">Clear Map</button>
      <button id="driveBtn" disabled>Start 3D Drive</button>
      <div id="info">
        Click 2 points on the map to set start and destination.
      </div>
      <div id="credit">Fallback model: CesiumMilkTruck (Cesium, CC-BY 4.0)</div>
    </div>

    <div id="map"></div>

    <script type="module">
      import * as maplibregl from "https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.mjs";
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      const OSRM_BASE_URL = "http://localhost:8081/route/v1";

      const FALLBACK_URL =
        "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/CesiumMilkTruck/glTF-Binary/CesiumMilkTruck.glb";
      const MODELS = {
        van: { urls: ["./models/van.glb", FALLBACK_URL], lengthM: 5.5 },
        truck: { urls: ["./models/truck.glb", FALLBACK_URL], lengthM: 9.5 },
      };
      const MODEL_YAW_OFFSET = 0;

      let vehicleBearing = 0;
      let vehicleLngLat = null;
      let vehicleVisible = false;
      const vehicleObjects = {};

      const map = new maplibregl.Map({
        container: "map",
        style: "https://tiles.openfreemap.org/styles/bright",
        center: [79.8612, 6.9271],
        zoom: 15,
        pitch: 50,
        bearing: -15,
        canvasContextAttributes: { antialias: true },
      });

      let waypoints = [];
      let markers = [];

      let isDriving = false;
      let animationId = null;
      let currentDistance = 0;
      let routeLength = 0;
      let routeLineFeature = null;
      let lastTime = 0;
      const simulationSpeedKmh = 60;
      const speedMs = simulationSpeedKmh / 3.6;

      const vehicleSelect = document.getElementById("vehicle");
      const infoPanel = document.getElementById("info");
      const clearBtn = document.getElementById("clearBtn");
      const driveBtn = document.getElementById("driveBtn");

      const gltfLoader = new GLTFLoader();

      async function loadVehicle(key) {
        const { urls, lengthM } = MODELS[key];
        for (const url of urls) {
          try {
            const gltf = await gltfLoader.loadAsync(url);
            const model = gltf.scene;

            let box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            model.scale.setScalar(lengthM / Math.max(size.x, size.z));
            box = new THREE.Box3().setFromObject(model);
            const c = box.getCenter(new THREE.Vector3());
            model.position.set(-c.x, -box.min.y, -c.z);

            const group = new THREE.Group();
            group.add(model);
            return group;
          } catch (e) {
            console.warn(`Could not load ${url}`, e);
          }
        }
        return null;
      }

      const vehicleLayer = {
        id: "vehicle-3d",
        type: "custom",
        renderingMode: "3d",
        onAdd(map, gl) {
          this.camera = new THREE.Camera();
          this.scene = new THREE.Scene();
          this.scene.add(new THREE.AmbientLight(0xffffff, 1.2));
          const sun = new THREE.DirectionalLight(0xffffff, 2);
          sun.position.set(50, -70, 100).normalize();
          this.scene.add(sun);

          this.renderer = new THREE.WebGLRenderer({
            canvas: map.getCanvas(),
            context: gl,
            antialias: true,
          });
          this.renderer.autoClear = false;
          this.map = map;

          Promise.all(
            Object.keys(MODELS).map(async (k) => {
              const obj = await loadVehicle(k);
              if (obj) {
                vehicleObjects[k] = obj;
                obj.visible = false;
                this.scene.add(obj);
              }
              map.triggerRepaint();
            }),
          );
        },
        render(gl, args) {
          if (!vehicleLngLat) return;
          const active = vehicleSelect.value;
          for (const k in vehicleObjects) {
            vehicleObjects[k].visible = vehicleVisible && k === active;
          }

          const mc = maplibregl.MercatorCoordinate.fromLngLat(vehicleLngLat, 0);
          const s = mc.meterInMercatorCoordinateUnits();
          const yaw =
            Math.PI - (vehicleBearing * Math.PI) / 180 + MODEL_YAW_OFFSET;

          const model = new THREE.Matrix4()
            .makeTranslation(mc.x, mc.y, mc.z)
            .scale(new THREE.Vector3(s, -s, s))
            .multiply(new THREE.Matrix4().makeRotationZ(yaw))
            .multiply(new THREE.Matrix4().makeRotationX(Math.PI / 2));

          const projection =
            args.defaultProjectionData?.mainMatrix ?? args.matrix ?? args;
          this.camera.projectionMatrix = new THREE.Matrix4()
            .fromArray(projection)
            .multiply(model);

          this.renderer.resetState();
          this.renderer.render(this.scene, this.camera);
        },
      };

      map.on("load", () => {
        const layers = map.getStyle().layers;
        let labelLayerId;
        for (let i = 0; i < layers.length; i++) {
          if (layers[i].type === "symbol" && layers[i].layout["text-field"]) {
            labelLayerId = layers[i].id;
            break;
          }
        }

        map.addSource("route", {
          type: "geojson",
          data: { type: "FeatureCollection", features: [] },
        });

        map.addLayer({
          id: "route-casing",
          type: "line",
          source: "route",
          layout: { "line-join": "round", "line-cap": "round" },
          paint: {
            "line-color": "#000000",
            "line-width": 8,
            "line-opacity": 0.3,
          },
        });

        map.addLayer({
          id: "route-line",
          type: "line",
          source: "route",
          layout: { "line-join": "round", "line-cap": "round" },
          paint: {
            "line-color": "#0070f3",
            "line-width": 5,
            "line-opacity": 0.95,
          },
        });

        map.addSource("openfreemap", {
          url: "https://tiles.openfreemap.org/planet",
          type: "vector",
        });

        map.addLayer(
          {
            id: "3d-buildings",
            source: "openfreemap",
            "source-layer": "building",
            type: "fill-extrusion",
            minzoom: 14,
            filter: ["!=", ["get", "hide_3d"], true],
            paint: {
              "fill-extrusion-color": [
                "interpolate",
                ["linear"],
                ["get", "render_height"],
                0,
                "#d1d5db",
                50,
                "#93c5fd",
                150,
                "#3b82f6",
                300,
                "#1d4ed8",
              ],
              "fill-extrusion-height": [
                "interpolate",
                ["linear"],
                ["zoom"],
                14,
                0,
                15.5,
                ["get", "render_height"],
              ],
              "fill-extrusion-base": [
                "case",
                [">=", ["get", "zoom"], 15.5],
                ["get", "render_min_height"],
                0,
              ],
              "fill-extrusion-opacity": 0.85,
            },
          },
          labelLayerId,
        );

        map.addLayer(vehicleLayer);

        map.on("click", (e) => {
          if (waypoints.length >= 2) return;

          const lngLat = [e.lngLat.lng, e.lngLat.lat];
          waypoints.push(lngLat);

          const markerColor = waypoints.length === 1 ? "#10b981" : "#ef4444";
          const marker = new maplibregl.Marker({ color: markerColor })
            .setLngLat(lngLat)
            .addTo(map);

          markers.push(marker);

          if (waypoints.length === 1) {
            infoPanel.innerText =
              "Start point selected. Click destination point.";
          } else if (waypoints.length === 2) {
            calculateRoute();
          }
        });
      });

      vehicleSelect.addEventListener("change", () => {
        if (waypoints.length === 2) calculateRoute();
      });

      clearBtn.addEventListener("click", () => {
        waypoints = [];
        markers.forEach((m) => m.remove());
        markers = [];

        vehicleVisible = false;
        vehicleLngLat = null;
        map.triggerRepaint();

        stopDrive();
        driveBtn.disabled = true;

        if (map.getSource("route")) {
          map
            .getSource("route")
            .setData({ type: "FeatureCollection", features: [] });
        }
        infoPanel.innerText =
          "Click 2 points on the map to set start and destination.";
      });

      driveBtn.addEventListener("click", () => {
        if (isDriving) {
          stopDrive();
        } else {
          startDrive();
        }
      });

      async function calculateRoute() {
        stopDrive();
        infoPanel.innerText = "Calculating path...";
        driveBtn.disabled = true;

        const vehicle = vehicleSelect.value;
        const start = waypoints[0];
        const end = waypoints[1];

        const coords = `${start[0]},${start[1]};${end[0]},${end[1]}`;
        const url = `${OSRM_BASE_URL}/${vehicle}/${coords}?overview=full&geometries=geojson`;

        try {
          const response = await fetch(url);
          const data = await response.json();

          if (data.code !== "Ok" || !data.routes || data.routes.length === 0) {
            infoPanel.innerText = "No route found between selected points.";
            return;
          }

          const route = data.routes[0];

          // Setup Geometry and Turf Data
          routeLineFeature = turf.lineString(route.geometry.coordinates);
          routeLength =
            turf.length(routeLineFeature, { units: "kilometers" }) * 1000;
          currentDistance = 0;

          // Update HUD
          const distanceKm = (route.distance / 1000).toFixed(2);
          const totalMinutes = Math.round(route.duration / 60);
          const eta =
            totalMinutes > 60
              ? `${Math.floor(totalMinutes / 60)} hr ${totalMinutes % 60} min`
              : `${totalMinutes} min`;

          infoPanel.innerHTML = `
        <strong>Vehicle:</strong> ${vehicle.toUpperCase()}<br>
        <strong>Distance:</strong> ${distanceKm} km<br>
        <strong>ETA:</strong> ${eta}
      `;

          // Update Path Appearance
          const colorMain = vehicle === "truck" ? "#dc2626" : "#2563eb";
          map.setPaintProperty("route-line", "line-color", colorMain);
          map.getSource("route").setData(routeLineFeature);

          // Place the real 3D vehicle at the start, facing along the route
          const rc = route.geometry.coordinates;
          vehicleLngLat = waypoints[0];
          vehicleVisible = true;
          vehicleBearing = turf.bearing(rc[0], rc[Math.min(3, rc.length - 1)]);
          map.triggerRepaint();

          // Reset View
          const bounds = rc.reduce(
            (b, coord) => b.extend(coord),
            new maplibregl.LngLatBounds(start, start),
          );
          map.fitBounds(bounds, { padding: 90, pitch: 50, maxZoom: 17 });

          driveBtn.disabled = false;
        } catch (err) {
          console.error(err);
          infoPanel.innerText =
            "Failed to connect to OSRM gateway on port 8081.";
        }
      }

      function startDrive() {
        map.stop();

        isDriving = true;
        lastTime = null; // sync timer on the very first frame

        driveBtn.innerText = "Stop Simulation";
        driveBtn.style.background = "#ef4444";
        markers.forEach((m) => (m.getElement().style.display = "none"));

        // Current position
        const distKm = currentDistance / 1000;
        const currentPos = turf.along(routeLineFeature, distKm, {
          units: "kilometers",
        }).geometry.coordinates;

        let initialBearing = vehicleBearing;
        if (currentDistance + 2 < routeLength) {
          const nextPos = turf.along(
            routeLineFeature,
            (currentDistance + 2) / 1000,
            { units: "kilometers" },
          ).geometry.coordinates;
          initialBearing = turf.bearing(currentPos, nextPos);
        }

        vehicleLngLat = currentPos;
        vehicleBearing = initialBearing;

        // Put the camera in the driver's seat before the first frame
        map.jumpTo({
          center: currentPos,
          bearing: initialBearing,
          pitch: 75,
          zoom: 20,
        });

        animationId = requestAnimationFrame(animateCamera);
      }

      function animateCamera(timestamp) {
        if (!isDriving) return;

        if (!lastTime) lastTime = timestamp;

        let dt = (timestamp - lastTime) / 1000;
        if (dt < 0) dt = 0; // never let time flow backwards
        lastTime = timestamp;

        currentDistance += speedMs * dt;

        if (currentDistance >= routeLength) {
          stopDrive();
          currentDistance = 0; // reset for the next play
          return;
        }

        // Position along the line
        const distKm = currentDistance / 1000;
        const currentPos = turf.along(routeLineFeature, distKm, {
          units: "kilometers",
        }).geometry.coordinates;

        // Heading: look 2 meters ahead
        let bearing = vehicleBearing;
        if (currentDistance + 2 < routeLength) {
          const nextPosDistKm = (currentDistance + 2) / 1000;
          const nextPos = turf.along(routeLineFeature, nextPosDistKm, {
            units: "kilometers",
          }).geometry.coordinates;
          bearing = turf.bearing(currentPos, nextPos);
        }

        // Update 3D vehicle (rendered by the custom layer on the next repaint)
        vehicleLngLat = currentPos;
        vehicleBearing = bearing;

        // Low-angle trailing chase camera
        map.jumpTo({
          center: currentPos,
          bearing: bearing,
          pitch: 75,
          zoom: 20,
        });

        animationId = requestAnimationFrame(animateCamera);
      }

      function stopDrive() {
        isDriving = false;
        if (animationId) cancelAnimationFrame(animationId);
        driveBtn.innerText = "Start 3D Drive";
        driveBtn.style.background = "#10b981";
        markers.forEach((m) => (m.getElement().style.display = "block"));
      }
    </script>
  </body>
</html>
