info:
  name: Update User
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/users/{{userId}}"
  body:
    type: json
    data: |-
      {
        "firstName": "Jane",
        "lastName": "Silva",
        "email": "jane.silva@example.com",
        "phone": "0712345678"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Update a user's profile fields (firstName, lastName, email, phone, avatar — all optional). Dispatcher only (Bearer `{{dispatcherAccessToken}}` from the folder).

  Role and status have their own endpoints; password changes via Auth → Change Password.
