info:
  name: Login
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "phone": "{{phone}}",
        "password": "{{password}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.body?.data;
        if (data?.accessToken) bru.setVar("accessToken", data.accessToken);
        if (data?.refreshToken) bru.setVar("refreshToken", data.refreshToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Log in with phone + password. Public. The account must be verified (active).

  Response `data`: `{ accessToken, refreshToken, user }`. Tokens are saved to runtime vars and used by the protected requests.
