info:
  name: Change Password
  type: http
  seq: 8

http:
  method: PUT
  url: "{{baseUrl}}/auth/change-password"
  body:
    type: json
    data: |-
      {
        "currentPassword": "{{password}}",
        "newPassword": "newPassword123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Change the logged-in user's password. Requires Bearer access token.

  `newPassword` must be at least 6 characters.
