info:
  name: Update Me
  type: http
  seq: 7

http:
  method: PUT
  url: "{{baseUrl}}/auth/me"
  body:
    type: json
    data: |-
      {
        "firstName": "John",
        "lastName": "Doe",
        "phone": "{{phone}}",
        "avatar": "https://example.com/avatar.png"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Update the logged-in user's profile. Requires Bearer access token.

  All fields are optional; send only the ones to change.
