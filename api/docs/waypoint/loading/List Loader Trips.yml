info:
  name: List Loader Trips
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/trips?date={{serviceDate}}&status=ready_to_load"
  auth:
    type: bearer
    token: "{{loaderAccessToken}}"

runtime:
  variables:
    - name: serviceDate
      value: 2026-10-02

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
