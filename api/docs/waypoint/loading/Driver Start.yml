info:
  name: Driver Start
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/trips/{{tripId}}/start"
  body:
    type: json
    data: |-
      {
        "clientId": "{{startClientId}}",
        "startedAt": "{{startedAt}}",
        "otp": "{{dispatchCode}}"
      }
  auth:
    type: bearer
    token: "{{driverAccessToken}}"

runtime:
  variables:
    - name: tripId
      value: 9c9acd3e-5f21-4f79-b22a-51979d334687

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
