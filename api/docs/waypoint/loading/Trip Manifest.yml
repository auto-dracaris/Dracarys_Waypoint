info:
  name: Trip Manifest
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/trips/{{tripId}}"
  auth:
    type: bearer
    token: "{{loaderAccessToken}}"

runtime:
  variables:
    - name: tripId
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
