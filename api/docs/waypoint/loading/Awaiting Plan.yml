info:
  name: Awaiting Plan
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/trips?date={{serviceDate}}&status=awaiting_plan"
  auth:
    type: bearer
    token: "{{loaderAccessToken}}"

runtime:
  variables:
    - name: serviceDate
      value: 2026-10-03

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
