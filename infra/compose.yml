name: waypoint-ai-infra

services:
  ai-postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: waypoint_ai
      POSTGRES_USER: waypoint_ai
      POSTGRES_PASSWORD: ${AI_POSTGRES_PASSWORD:?Run infra/setup.ps1 first}
    ports:
      - '127.0.0.1:${AI_POSTGRES_PORT:-5434}:5432'
    volumes:
      - ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U waypoint_ai -d waypoint_ai']
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.19.1}
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Run infra/setup.ps1 first}
    ports:
      - '127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333'
      - '127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334'
    volumes:
      - qdrant_data:/qdrant/storage

  tempo:
    profiles: ['monitoring']
    image: ${TEMPO_IMAGE:-grafana/tempo:3.1.0}
    restart: unless-stopped
    command: ['-target=all', '-config.file=/etc/tempo.yaml']
    ports:
      - '127.0.0.1:${TEMPO_HTTP_PORT:-3200}:3200'
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo

  otel-collector:
    profiles: ['monitoring']
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.161.0}
    restart: unless-stopped
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    ports:
      - '127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317'
      - '127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318'
      - '127.0.0.1:${OTEL_HEALTH_PORT:-13133}:13133'
    volumes:
      - ./monitoring/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - tempo

  grafana:
    profiles: ['monitoring']
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.2.3}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run infra/setup.ps1 first}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3001}:3000'
    volumes:
      - ./monitoring/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/tempo.yaml:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - tempo

volumes:
  ai_postgres_data:
  qdrant_data:
  tempo_data:
  grafana_data:
