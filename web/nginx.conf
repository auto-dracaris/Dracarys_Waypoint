# The single way in: serves the web build and passes /api and /ai-api on to
# the two backends (the same paths the Vite dev proxy uses).
server {
  listen 80;
  root /usr/share/nginx/html;

  # Above the largest upload a backend accepts (AI documents, 21 MiB).
  client_max_body_size 25m;

  # Docker's DNS, looked up per request, so Nginx starts and stays up even
  # while a backend is still starting or restarting.
  resolver 127.0.0.11 valid=10s;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/ {
    set $api http://api:5000;
    proxy_pass $api;
  }

  # The AI service has no /ai-api prefix of its own.
  location /ai-api/ {
    set $ai http://ai-service:8000;
    rewrite ^/ai-api/(.*)$ /$1 break;
    proxy_pass $ai;
  }

  # Client-side routes all load the app.
  location / {
    try_files $uri /index.html;
  }
}
